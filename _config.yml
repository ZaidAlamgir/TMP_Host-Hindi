title: The Hindi Post | TMP News
description: "द हिंदी पोस्ट (TMP News): देश-विदेश की ताज़ा ख़बरें, भारतीय राजनीति, अंतरराष्ट्रीय कूटनीति, अर्थव्यवस्था और विश्लेषण की निष्पक्ष और विश्वसनीय रिपोर्टिंग।"
permalink: /news/:categories/:title/

# Site-wide SEO keywords
keywords: ["The Hindi Post", "TMP News", "Hindi post", "World Politics", "Indian Politics", "Global Affairs", "Technology", "Global Economy"]

# Add this section to explicitly enable the sitemap plugin
plugins:
  - jekyll-sitemap
  - jekyll-feed

baseurl: "" 
url: "https://thehindipost.tmpnews.com"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Tell Jekyll to process the _live_updates and _authors folders as collections
collections:
  live_updates:
    output: true 
  authors:
    output: true
    permalink: /author/:name/

# Tell Jekyll to include these files/folders in the final build
include:
  - cms.html
  - liveCMS.html
  - latest.html
  - about.html
  - news-hub.html 
  - post.html
  - .well-known
  - auth-callback.html
  - write.html
  - founder.html
  - _headers
# Exclude from processing.
exclude:
  - archive/
  - _archive/
  - scripts/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - _article_repos/